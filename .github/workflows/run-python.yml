name: Run Python Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Create venv + install deps in ONE step (activation persists within the step)
      - name: Set up virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Use the venv's Python explicitly for your scripts
      - name: Run Python files
        run: |
          source venv/bin/activate
          python Beam Spot Plotter.py  # Run your main script
          # Add other Python files here:
          # python script1.py
          # python script2.py
