name: Run Python Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Upgrade pip and install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Install critical packages directly if no requirements.txt
            pip install pandas numpy matplotlib  # Add other packages your script needs
          fi

      # Run your script (handles spaces in filename)
      - name: Run script
        run: python "Beam Spot Plotter.py"
